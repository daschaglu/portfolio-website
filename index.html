<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dasha Glushkova</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p class="name">Dasha Glushkova</p>

    <nav class="dock" aria-label="Filters">
      <button type="button" class="filter is-active" data-filter="editorial">
        Editorial
      </button>
      <span class="sep" aria-hidden="true">/</span>
      <button type="button" class="filter" data-filter="commercial">
        Commercial
      </button>
    </nav>

    <button type="button" class="bar-link" id="about" aria-expanded="false">About</button>
    <button type="button" class="bar-link" id="contacts" aria-expanded="false">Contacts</button>

    <main id="work"></main>

    <button type="button" class="sticker" hidden>
       Dasha Glushkova is a graphic designer based in The Hague, currently open to commissions.
    </button>

    <button type="button" class="contact-band" hidden></button>

    <button type="button" class="project-band" hidden></button>

    <script src="projects.js"></script>
    <script src="script.js"></script>
  </body>
</html>
